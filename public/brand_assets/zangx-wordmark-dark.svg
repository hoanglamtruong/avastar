<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 140" fill="none">
  <defs>
    <linearGradient id="sparkGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7E7C4" />
      <stop offset="50%" stop-color="#C9AA72" />
      <stop offset="100%" stop-color="#A07F43" />
    </linearGradient>
    <filter id="subtleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .brand-title {
      font-family: 'Manrope', 'Montserrat', 'Inter', -apple-system, sans-serif;
      font-weight: 800;
      font-size: 58px;
      letter-spacing: 0.12em;
      fill: #F4F0E8;
    }
    .brand-sub {
      font-family: 'Manrope', 'Inter', sans-serif;
      font-weight: 600;
      font-size: 13.5px;
      letter-spacing: 0.38em;
      fill: #AEBCC5;
    }
  </style>

  <!-- Z A N G -->
  <text x="35" y="72" class="brand-title">ZANG</text>

  <!-- 45-degree Signature Spark X -->
  <g transform="translate(268, 52)" filter="url(#subtleGlow)">
    <path d="M 0 -8 
             Q 2 -2, 26 -26 
             Q 2 2, 8 0 
             Q 2 -2, 26 26 
             Q -2 2, 0 8 
             Q 2 -2, -26 26 
             Q -2 -2, -8 0 
             Q -2 2, -26 -26 
             Q -2 -2, 0 -8 Z" 
          fill="url(#sparkGold)" />
    
    <path d="M 0 -15 L 2.5 -3 L 3.5 0 L 2.5 3 L 0 15 L -2.5 3 L -3.5 0 L -2.5 -3 Z" 
          fill="#FFF9E6" opacity="0.9" />
    <path d="M -15 0 L -3 2.5 L 0 3.5 L 3 2.5 L 15 0 L 3 -2.5 L 0 -3.5 L -3 -2.5 Z" 
          fill="#FFF9E6" opacity="0.9" />
    <circle cx="0" cy="0" r="2.8" fill="#FFFFFF" />
  </g>

  <!-- Divider hair-line with gold dot -->
  <line x1="35" y1="92" x2="310" y2="92" stroke="#AEBCC5" stroke-width="0.8" stroke-opacity="0.3" />
  <circle cx="310" cy="92" r="1.5" fill="#C9AA72" />

  <!-- Subtitle: THE DIGITAL ATELIER -->
  <text x="36" y="112" class="brand-sub">THE DIGITAL ATELIER</text>
</svg>