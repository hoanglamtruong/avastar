<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1D2F" />
      <stop offset="100%" stop-color="#07111F" />
    </linearGradient>
    <linearGradient id="champagneGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2DFB8" />
      <stop offset="50%" stop-color="#C9AA72" />
      <stop offset="100%" stop-color="#9C7B42" />
    </linearGradient>
    <radialGradient id="sparkHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C9AA72" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#C9AA72" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#C9AA72" stop-opacity="0" />
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="200" height="200" rx="44" fill="url(#bgGrad)" />
  <rect width="198" height="198" x="1" y="1" rx="43" stroke="#102A43" stroke-width="1.5" />

  <!-- Ambient Spark Halo -->
  <circle cx="100" cy="100" r="50" fill="url(#sparkHalo)" />

  <!-- 1. ENSŌ RING (Flow / Creativity / Human Intuition) -->
  <path d="M 100 26 
           A 74 74 0 1 1 34 128 
           A 72 72 0 0 1 90 28" 
        stroke="#AEBCC5" 
        stroke-width="2.5" 
        stroke-linecap="round" 
        stroke-opacity="0.5" />
  <path d="M 100 24 
           A 76 76 0 0 1 168 148" 
        stroke="url(#champagneGold)" 
        stroke-width="1.5" 
        stroke-linecap="round" 
        stroke-opacity="0.4" />

  <!-- 2. HEXAGON (System / Structure / Agent Architecture) -->
  <polygon points="100,44 148.5,72 148.5,128 100,156 51.5,128 51.5,72" 
           stroke="#F4F0E8" 
           stroke-width="1.8" 
           stroke-linejoin="round" 
           stroke-opacity="0.85" 
           fill="#102A43" 
           fill-opacity="0.35" />

  <!-- Hexagonal Node Vertices -->
  <circle cx="100" cy="44" r="2.5" fill="url(#champagneGold)" />
  <circle cx="148.5" cy="72" r="2.5" fill="url(#champagneGold)" />
  <circle cx="148.5" cy="128" r="2.5" fill="url(#champagneGold)" />
  <circle cx="100" cy="156" r="2.5" fill="url(#champagneGold)" />
  <circle cx="51.5" cy="128" r="2.5" fill="url(#champagneGold)" />
  <circle cx="51.5" cy="72" r="2.5" fill="url(#champagneGold)" />

  <!-- 3. CENTRAL 45-DEGREE SPARK (X - Insight / Possibility) -->
  <g transform="translate(100, 100)" filter="url(#softGlow)">
    <path d="M 0 -6 
             Q 1.5 -1.5, 20 -20 
             Q 1.5 1.5, 6 0 
             Q 1.5 -1.5, 20 20 
             Q -1.5 1.5, 0 6 
             Q 1.5 -1.5, -20 20 
             Q -1.5 -1.5, -6 0 
             Q -1.5 1.5, -20 -20 
             Q -1.5 -1.5, 0 -6 Z" 
          fill="url(#champagneGold)" />

    <path d="M 0 -13 L 2 -3 L 3 0 L 2 3 L 0 13 L -2 3 L -3 0 L -2 -3 Z" 
          fill="#FFF6E0" opacity="0.9" />
    <path d="M -13 0 L -3 2 L 0 3 L 3 2 L 13 0 L 3 -2 L 0 -3 L -3 -2 Z" 
          fill="#FFF6E0" opacity="0.9" />
    <circle cx="0" cy="0" r="2.2" fill="#FFFFFF" />
  </g>

  <!-- Accent Pulse Dot (ZANGX Green AI Indicator) -->
  <circle cx="158" cy="42" r="3.5" fill="#A8F238" />
  <circle cx="158" cy="42" r="7" stroke="#A8F238" stroke-width="1" stroke-opacity="0.4" />
</svg>