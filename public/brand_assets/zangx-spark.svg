<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="champagneGrad" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#F2DFB8" />
      <stop offset="50%" stop-color="#C9AA72" />
      <stop offset="100%" stop-color="#9A7B44" />
    </linearGradient>
    <filter id="sparkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- 45-degree signature spark -->
  <g transform="translate(50, 50)" filter="url(#sparkGlow)">
    <path d="M 0 -10 
             Q 3 -3, 38 -38 
             Q 3 3, 10 0 
             Q 3 -3, 38 38 
             Q -3 3, 0 10 
             Q 3 -3, -38 38 
             Q -3 -3, -10 0 
             Q -3 3, -38 -38 
             Q -3 -3, 0 -10 Z" 
          fill="url(#champagneGrad)" />
    <!-- Fine inner facet light -->
    <path d="M 0 -22 L 3.5 -5 L 5 0 L 3.5 5 L 0 22 L -3.5 5 L -5 0 L -3.5 -5 Z" 
          fill="#FFF9E6" opacity="0.9" />
    <path d="M -22 0 L -5 3.5 L 0 5 L 5 3.5 L 22 0 L 5 -3.5 L 0 -5 L -5 -3.5 Z" 
          fill="#FFF9E6" opacity="0.9" />
    <circle cx="0" cy="0" r="3.5" fill="#FFFFFF" />
  </g>
</svg>