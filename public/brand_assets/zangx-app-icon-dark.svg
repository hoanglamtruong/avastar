<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="appBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1E31" />
      <stop offset="50%" stop-color="#07111F" />
      <stop offset="100%" stop-color="#040810" />
    </linearGradient>
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8E8C9" />
      <stop offset="50%" stop-color="#C9AA72" />
      <stop offset="100%" stop-color="#917036" />
    </linearGradient>
    <radialGradient id="appGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C9AA72" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#C9AA72" stop-opacity="0" />
    </radialGradient>
    <filter id="sparkBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- iOS / Squircle App Icon Container -->
  <rect width="512" height="512" rx="114" fill="url(#appBg)" />
  <rect width="510" height="510" x="1" y="1" rx="113" stroke="#1D344B" stroke-width="2" />

  <circle cx="256" cy="256" r="140" fill="url(#appGlow)" />

  <!-- Ensō Circle (Flow) -->
  <path d="M 256 68 
           A 188 188 0 1 1 84 322 
           A 182 182 0 0 1 228 72" 
        stroke="#AEBCC5" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-opacity="0.45" />

  <!-- Hexagon (System) -->
  <polygon points="256,122 374,189 374,323 256,390 138,323 138,189" 
           stroke="#F4F0E8" 
           stroke-width="4" 
           stroke-linejoin="round" 
           stroke-opacity="0.9" 
           fill="#102A43" 
           fill-opacity="0.4" />

  <!-- Node points -->
  <circle cx="256" cy="122" r="6" fill="url(#goldAcc)" />
  <circle cx="374" cy="189" r="6" fill="url(#goldAcc)" />
  <circle cx="374" cy="323" r="6" fill="url(#goldAcc)" />
  <circle cx="256" cy="390" r="6" fill="url(#goldAcc)" />
  <circle cx="138" cy="323" r="6" fill="url(#goldAcc)" />
  <circle cx="138" cy="189" r="6" fill="url(#goldAcc)" />

  <!-- Spark (X) -->
  <g transform="translate(256, 256)" filter="url(#sparkBloom)">
    <path d="M 0 -22 
             Q 5 -5, 68 -68 
             Q 5 5, 22 0 
             Q 5 -5, 68 68 
             Q -5 5, 0 22 
             Q 5 -5, -68 68 
             Q -5 -5, -22 0 
             Q -5 5, -68 -68 
             Q -5 -5, 0 -22 Z" 
          fill="url(#goldAcc)" />
    
    <circle cx="0" cy="0" r="7" fill="#FFFFFF" />
  </g>

  <!-- Green Signal of AI live agent -->
  <circle cx="396" cy="116" r="8" fill="#A8F238" />
  <circle cx="396" cy="116" r="16" stroke="#A8F238" stroke-width="2" stroke-opacity="0.5" />
</svg>